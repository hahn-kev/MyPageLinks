name: Build and Publish to AMO

# On every push to master this workflow builds, lints, and packages the
# extension, and uploads the resulting zip as a build artifact.
#
# It also publishes the new version to addons.mozilla.org -- but ONLY once
# the AMO API secrets exist. Until AMO_JWT_ISSUER is set as a repository
# secret, the publish/tag steps are skipped, so the workflow does everything
# except publish.
#
# The version is generated by CI, not stored in the manifest: it is the
# manifest's major.minor followed by the total commit count, e.g. "1.0.57".
# Commit count is monotonic, so each push yields a strictly-increasing,
# unique version (AMO rejects duplicate versions). Bump major/minor by
# editing the manifest version; the patch component is always derived here.
#
# A `v<version>` tag is created on publish; if it already exists (e.g. a
# re-run of the same commit) publishing is skipped so the same version is
# never uploaded twice.
#
# Prerequisite for publishing: the add-on must already exist on AMO (the
# first listing must be created manually via the Developer Hub -- the API
# can only add new versions to an existing listing).
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   AMO_JWT_ISSUER  - the JWT issuer from AMO -> Manage API Keys
#   AMO_JWT_SECRET  - the JWT secret from AMO -> Manage API Keys

on:
  push:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: publish-amo
  cancel-in-progress: false

env:
  AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute version
        id: version
        run: |
          base=$(node -p "require('./src/manifest.json').version.split('.').slice(0,2).join('.')")
          count=$(git rev-list --count HEAD)
          echo "version=$base.$count" >> "$GITHUB_OUTPUT"

      - name: Check whether this version is already published
        id: check
        run: |
          if git rev-parse -q --verify "refs/tags/v${{ steps.version.outputs.version }}" >/dev/null; then
            echo "Tag v${{ steps.version.outputs.version }} already exists - will not publish."
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Stamp version into manifest
        run: |
          node -e "const fs=require('fs'),p='./src/manifest.json',m=require(p);m.version=process.argv[1];fs.writeFileSync(p,JSON.stringify(m,null,2)+'\n')" "${{ steps.version.outputs.version }}"

      - name: Build
        run: pnpm run build

      - name: Lint
        run: pnpm run lint

      - name: Package
        run: pnpm exec web-ext build --source-dir dist --artifacts-dir artifacts --overwrite-dest

      - name: Upload zip artifact
        uses: actions/upload-artifact@v7
        with:
          name: mypagelinks-${{ steps.version.outputs.version }}
          path: artifacts/*.zip
          if-no-files-found: error

      - name: Sign and submit to AMO
        if: env.AMO_JWT_ISSUER != '' && steps.check.outputs.tag_exists == 'false'
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: pnpm exec web-ext sign --source-dir dist --channel listed

      - name: Tag published version
        if: env.AMO_JWT_ISSUER != '' && steps.check.outputs.tag_exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"
